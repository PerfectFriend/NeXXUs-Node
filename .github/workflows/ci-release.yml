name: NeXXUs CI & Automated Release Builder

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test & Package NeXXUs Node
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ⚡ Set up Node.js LTS (v20)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🔍 Lint codebase (TypeScript)
        run: npm run lint

      - name: 🧪 Run Protocol & Golden Vector Test Suites (113 checks)
        run: npm test

      - name: ⚡ Build Native Rust Daemon (nexxusd)
        run: |
          mkdir -p dist
          cargo build --release -p nexxus-node
          cp target/release/nexxusd dist/nexxusd
          chmod +x dist/nexxusd
          ls -lh dist/nexxusd

      - name: 📦 Build Debian / Ubuntu amd64 Package (.deb)
        run: |
          bash scripts/build-deb.sh
          ls -lh dist/

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexxus-dist
          path: |
            dist/nexxusd
            dist/*.deb

  rust:
    name: Rust — test, clippy, build nexxusd
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🦀 Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head)

      - name: 💾 Cache cargo registry & target
        uses: Swatinem/rust-cache@8e5c1b06e3a0fd2c96bac3adb874c63aa660ea6a # v2.7.6

      - name: 🧪 cargo test --workspace
        run: cargo test --workspace

      - name: 🧹 cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 🔨 cargo build --release -p nexxus-node
        run: cargo build --release -p nexxus-node

      - name: 📤 Upload nexxusd artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexxusd-rust
          path: target/release/nexxusd

  rust-tor:
    name: Rust — build with --features tor (heavy deps)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🦀 Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head)

      - name: 💾 Cache cargo registry & target
        uses: Swatinem/rust-cache@8e5c1b06e3a0fd2c96bac3adb874c63aa660ea6a # v2.7.6

      - name: 🔨 cargo build --release -p nexxus-node --features tor
        run: cargo build --release -p nexxus-node --features tor

  desktop:
    name: Desktop — Rust backend + frontend bundle
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🦀 Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head)

      - name: ⚡ Set up Node.js LTS (v20)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🖥 System deps for Tauri backend (glib/gio + webkit)
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Frontend dist placeholder (src-tauri/gen is gitignored, собирается позже)
        run: |
          mkdir -p nexxus-desktop/src-tauri/gen
          cp nexxus-desktop/src/index.html nexxus-desktop/src-tauri/gen/index.html

      - name: 🔨 Build desktop Rust backend
        run: cargo build --release
        working-directory: nexxus-desktop

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🔨 Build frontend bundle
        run: npm run build

      - name: 📤 Upload nexxus-desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexxus-desktop-rust
          path: nexxus-desktop/target/release/nexxus-desktop

  deb:
    name: Debian package (Rust binaries)
    needs: [ rust, desktop ]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 📥 Download nexxusd (Rust) artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxusd-rust
          path: dist

      - name: 📥 Download nexxus-desktop (Rust) artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxus-desktop-rust
          path: dist

      - name: 📦 Build .deb with Rust binaries
        run: bash scripts/build-deb-rust.sh dist/nexxusd dist/nexxus-desktop

      - name: 📤 Upload .deb artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexxus-deb-rust
          path: dist/nexxus_*.deb

  appimage:
    name: AppImage (Linux x86_64)
    needs: [ rust, desktop ]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 📥 Download nexxusd (Rust) artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxusd-rust
          path: dist

      - name: 📥 Download nexxus-desktop (Rust) artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxus-desktop-rust
          path: dist

      - name: 📦 Build AppImage
        run: bash scripts/build-appimage.sh dist/nexxusd dist/nexxus-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: ✅ Smoke — AppImage распаковывается, nexxusd на месте
        run: |
          set -x
          chmod +x dist/NeXXus-*.AppImage
          ./dist/NeXXus-*.AppImage --appimage-extract >/dev/null
          ls -la squashfs-root/usr/bin/
          test -x squashfs-root/usr/bin/nexxusd
          test -x squashfs-root/usr/bin/nexxus-desktop
          rm -rf squashfs-root

      - name: 📤 Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexxus-appimage
          path: dist/*.AppImage

  android:
    name: Android APK — NeXXus Node Mobile (WebView + WS API)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: latest
          platform-tools: true
          build-tools: 36.0.0
          platforms: android-36

      - name: 🔨 Build debug APK
        working-directory: nexxus-mobile
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexxus-mobile-apk
          path: nexxus-mobile/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Windows - nexxusd.exe (mingw cross)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head)
        with:
          targets: x86_64-pc-windows-gnu

      # H-11: repo pins rust-toolchain.toml to 1.99.1, который перекрывает
      # toolchain от action — target надо ставить именно на 1.99.1.
      - name: Add windows-gnu target to pinned toolchain
        run: rustup target add x86_64-pc-windows-gnu --toolchain 1.99.1

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build nexxusd.exe (windows-gnu)
        run: cargo build --release --target x86_64-pc-windows-gnu -p nexxus-node

      - name: Smoke PE header
        run: file target/x86_64-pc-windows-gnu/release/nexxusd.exe

      - name: Upload nexxusd.exe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexxusd-windows
          path: target/x86_64-pc-windows-gnu/release/nexxusd.exe

      - name: 📦 Package Windows zip (exe + service scripts + README)
        run: |
          mkdir -p dist/windows/bin dist/windows/service
          cp target/x86_64-pc-windows-gnu/release/nexxusd.exe dist/windows/bin/
          cp scripts/windows/install-service.ps1 scripts/windows/uninstall-service.ps1 dist/windows/service/
          cp scripts/windows/nexxus-service.xml dist/windows/service/
          printf '%s\n' \
            'NeXXus Node - Windows x64' \
            '1. bin\nexxusd.exe - демон ноды (nexxusd.exe --help).' \
            '2. Служба: service\install-service.ps1 от администратора; удаление: service\uninstall-service.ps1.' \
            '3. API слушает только 127.0.0.1:4010, токен в ~/.nexxus/api.token (или NEXXUS_API_TOKEN).' \
            > dist/windows/README.txt
          cd dist/windows && zip -r ../nexxus-windows-x86_64.zip . && cd ../..
          ls -la dist/*.zip

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexxus-windows-zip
          path: dist/nexxus-windows-x86_64.zip

  tor-integration:
    name: Tor integration (opt-in, real onion publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (branch head)

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@8e5c1b06e3a0fd2c96bac3adb874c63aa660ea6a # v2.7.6

      - name: Run ignored tor integration test
        run: cargo test --release -p nexxus-node --features tor -- --ignored --nocapture
        timeout-minutes: 15

  release:
    name: Create GitHub Release
    needs: [ build-and-test, rust, rust-tor, desktop, deb, appimage, android, windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxus-dist
          path: dist

      - name: 📥 Download nexxusd (Rust) artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxusd-rust
          path: dist

      - name: 📥 Download nexxus-desktop (Rust) artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxus-desktop-rust
          path: dist

      - name: 📥 Download .deb (Rust) artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxus-deb-rust
          path: dist

      - name: 📥 Download AppImage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxus-appimage
          path: dist

      - name: 📥 Download Android APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxus-mobile-apk
          path: dist

      - name: 📥 Download nexxusd.exe (Windows) artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxusd-windows
          path: dist

      - name: 📥 Download Windows zip artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexxus-windows-zip
          path: dist

      - name: 🏷️ Rename Windows asset + stage service scripts
        run: |
          mv dist/nexxusd.exe dist/nexxusd-windows-x86_64.exe
          mkdir -p dist/windows
          cp scripts/windows/install-service.ps1 scripts/windows/uninstall-service.ps1 scripts/windows/nexxus-service.xml dist/windows/

      - name: '🔏 H-12: SHA256SUMS + minisign signature of release assets'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ''
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          echo "$MINISIGN_SECRET_KEY" | base64 -d > /tmp/nexxus-release.key
          chmod 600 /tmp/nexxus-release.key
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -exec sha256sum {} + > SHA256SUMS
          minisign -S -s /tmp/nexxus-release.key -m SHA256SUMS -x SHA256SUMS.minisig
          minisign -V -p ../keys/nexxus-release-minisign.pub -m SHA256SUMS -x SHA256SUMS.minisig
          cd ..
          cp dist/SHA256SUMS dist/SHA256SUMS.minisig .

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SHA256SUMS
            SHA256SUMS.minisig
            dist/nexxusd
            dist/nexxus-desktop
            dist/*.deb
            dist/*.AppImage
            dist/app-debug.apk
            dist/nexxusd-windows-x86_64.exe
            dist/nexxus-windows-x86_64.zip
            dist/windows/install-service.ps1
            dist/windows/uninstall-service.ps1
            dist/windows/nexxus-service.xml
            install.sh
            install.ps1
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
