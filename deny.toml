# cargo-deny config — P1-11/P1-12 (аудит 2026-11-23)
# Лицензии: разрешаем permissive; запрещаем copyleft (GPL/AGPL) и неизвестные.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
]
deny = ["GPL-2.0", "GPL-3.0", "AGPL-1.0", "AGPL-3.0", "LGPL-2.1", "LGPL-3.0", "SSPL-1.0"]
unlicensed = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[advisories]
# ignore-список живёт в .cargo/audit.toml (с обоснованиями и сроками, DEP-01)
